TML<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Từ Gia Yêu Thương</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        margin: 0;
        padding: 0;
        line-height: 1.6;
      }
      header {
        background: linear-gradient(to right, #ff9a9e, #fad0c4);
        color: white;
        text-align: center;
        padding: 60px 20px;
      }
      h1 {
        margin: 0;
        font-size: 3em;
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
      }
      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .family-member {
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        margin: 30px 0;
        padding: 25px;
        display: flex;
        align-items: center;
        gap: 30px;
      }
      .family-member img {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid #ff9a9e;
      }
      .info h2 {
        margin: 0 0 10px;
        color: #e74c3c;
      }
      footer {
        text-align: center;
        padding: 30px;
        background: #ff9a9e;
        color: white;
        margin-top: 50px;
      }
      @media (max-width: 768px) {
        .family-member {
          flex-direction: column;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Từ Gia - Chốn Yên Bình và Phát triển</h1>
      <p>Nơi trái tim luôn hướng về nhau ❤️</p>
    </header>
    <div class="container">
      <div class="family-member">
        <img src="/anhbame.jpg" alt="Cội nguồn của Từ Gia" />
        <div class="info">
          <h2>Anh Từ Gia</h2>
          <p>
            Trang do Từ Gia Yên lập - giai đoạn thử nghiệm - sẽ nâng cấp trong
            tương lai 💕
          </p>
        </div>
      </div>
      <!-- Anh có thể thêm thành viên khác ở đây -->
    </div>
    <footer>
      <p>© 2026 - Trang Từ Gia Yêu Thương. Được tạo bởi anh Từ Gia Yên ❤️</p>
    </footer>
  </body>
</html>
